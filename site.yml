---

- hosts: all
  become: true 
  pre_tasks: 


  - name: install httpd and php packages
    tags: httpd,php,RedHat
    package:
        name: 
         - httpd
         - php
        state: latest
        update_cache: yes
    when: ansible_distribution == "RedHat" and ansible_distribution_version == "8.2"
  

- hosts: web_servers
  tags: start-httpd
  become: true 
  tasks:


  - name: start httpd
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_distribution == "RedHat"


