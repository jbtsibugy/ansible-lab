---

- hosts: all
  become: true 
  tasks: 


  - name: install httpd and php packages
    package:
      name: 
        - httpd
        - php
      state: latest
      update_cache: yes
    when: ansible_distribution == "RedHat" and ansible_distribution_version == "8.2"
  


  - name: start httpd
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_distribution == "RedHat"


