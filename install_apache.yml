---

- hosts: all
  become: true 
  tasks: 

  - name: update repostiory index
    dnf:
     update_cache: yes 
    when: ansible_distribution == ["RedHat", "Ubuntu"] 

  - name: install httpd package
    ansible.builtin.dnf:
     name: httpd
     state: latest
    when: ansible_distribution == "RedHat" and ansible_distribution_version == "8.2"
  
  - name: start httpd
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_distribution == "RedHat"

  - name: add php support for httpd
    dnf:
      name: php
      state: latest
    when: ansible_distribution == "RedHat"
